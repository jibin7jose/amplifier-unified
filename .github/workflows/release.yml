name: Publish application release
on:
  push:
    branches: [main]
    # Only the dedicated version owner starts automatic publication. Dependency
    # and release-tool edits do not create a new immutable application version.
    paths:
      - amplifier_web/__init__.py
  workflow_dispatch:
    inputs:
      release_revision:
        description: Full merged commit SHA to qualify and publish; blank selects this main commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      candidate: ${{ steps.candidate.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Older manual targets still require ancestry proof; ordinary pushes
          # need only this exact commit and the matching tag fetched by plan.
          fetch-depth: ${{ inputs.release_revision != '' && '0' || '1' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Resolve immutable release target
        id: release
        env:
          SELECTED_RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release.py scripts/release_qualification.py scripts/frontend_release_proof.py "$RUNNER_TEMP/release-tools/"
          python "$RUNNER_TEMP/release-tools/release.py" plan --revision "$SELECTED_RELEASE_REVISION" --fetch-tag --output "$GITHUB_OUTPUT"
      - name: Pin the verified selected commit
        env:
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: git checkout --detach "$RELEASE_REVISION"
      - name: Resolve current installed host dependencies once
        run: |
          uv sync --locked --group dev --group artifacts
          uv run --no-sync python scripts/qualify_host_dependencies.py --evidence "$RUNNER_TEMP/host-resolution"
      - name: Bind the selected app and resolved host graph
        id: candidate
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" candidate --evidence "$RUNNER_TEMP/host-resolution" --output "$GITHUB_OUTPUT"
      - name: Share qualification tools from this workflow revision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
          if-no-files-found: error
      - name: Export the bound candidate for all qualification checks
        env:
          RELEASE_CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: echo "RELEASE_CANDIDATE=$RELEASE_CANDIDATE" >> "$GITHUB_ENV"
      # Full Python coverage runs locally or in python-checks.yml on demand.
      - name: Build and verify distributions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
          uv build
          python "$RUNNER_TEMP/release-tools/release.py" verify --version "$RELEASE_VERSION"
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" --overrides "$RUNNER_TEMP/host-resolution/qualified-overrides.txt" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/release-smoke/bin/python" -I -c 'from amplifier_web.app_updates import PROBE; exec(PROBE)'
      - name: Bind verified distributions to the candidate
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" receipt --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --lane package --destination "$RUNNER_TEMP/package.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-qualification
          path: ${{ runner.temp }}/package.json
          if-no-files-found: error
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Find exact trusted PR frontend proof
        id: frontend-proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/release-tools/frontend_release_proof.py" reuse --destination "$RUNNER_TEMP/frontend-proof-reuse.json" --output "$GITHUB_OUTPUT"
      - name: Validate frontend and committed assets
        if: steps.frontend-proof.outputs.reused != 'true'
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- amplifier_web/static
      - name: Record frontend qualification for this candidate
        run: |
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
          python "$RUNNER_TEMP/release-tools/release_qualification.py" receipt --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --lane frontend --destination "$RUNNER_TEMP/frontend.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-proof-reuse
          path: ${{ runner.temp }}/frontend-proof-reuse.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-qualification
          path: ${{ runner.temp }}/frontend.json
          if-no-files-found: error
      - name: Resolve declared private runtime dependency
        id: runtime-dependency
        run: |
          python -c 'import tomllib; p=tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb")); print("revision=" + p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])' >> "$GITHUB_OUTPUT"
      - name: Check out loop-live with its dedicated read-only key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Check out the community recipe contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-bundle-recipes
          ref: main
          path: .ci/recipes
          persist-credentials: false
      - name: Resolve fresh runtime sources before selecting any build cache
        run: |
          python -m pip install maturin
          python "$RUNNER_TEMP/release-tools/release_qualification.py" runtime-project --runtime "$RUNNER_TEMP/surface-runtime"
          uv add --project "$RUNNER_TEMP/surface-runtime" --frozen --editable "$GITHUB_WORKSPACE/.ci/loop-live"
          # The source-level recipe probe needs the module's declared dependencies.
          uv add --project "$RUNNER_TEMP/surface-runtime" --frozen --editable "$GITHUB_WORKSPACE/.ci/recipes/modules/tool-recipes"
          # The native peer regression composes AppService with the real Worker.
          uv add --project "$RUNNER_TEMP/surface-runtime" --frozen --editable "$GITHUB_WORKSPACE"
          uv add --project "$RUNNER_TEMP/surface-runtime" --frozen pytest pytest-asyncio 'amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate'
          uv lock --project "$RUNNER_TEMP/surface-runtime" --refresh --upgrade
      - name: Identify exact sources, Python ABI, platform and build toolchain
        id: runtime-cache
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" cache-key --runtime "$RUNNER_TEMP/surface-runtime" --output "$GITHUB_OUTPUT"
      - name: Restore only the matching runtime build cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/runtime-build-cache
          key: ${{ steps.runtime-cache.outputs.key }}
      - name: Install the frozen resolved runtime
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/runtime-build-cache
        run: |
          uv sync --project "$RUNNER_TEMP/surface-runtime" --locked
          python "$RUNNER_TEMP/release-tools/release_qualification.py" runtime-snapshot --runtime "$RUNNER_TEMP/surface-runtime"
          # The dedicated-key private checkout must not become a shared cache.
          uv cache clean amplifier-module-loop-live
          uv cache prune --ci
      - name: Save successful source builds independently of later test results
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/runtime-build-cache
          key: ${{ steps.runtime-cache.outputs.key }}
      - name: Verify surface context and recipe children through Core and loop-live
        run: |
          UNIFIED_RUNTIME_PYTHON="$RUNNER_TEMP/surface-runtime/.venv/bin/python" WARM_RECIPES_PATH="$GITHUB_WORKSPACE/.ci/recipes" "$RUNNER_TEMP/surface-runtime/.venv/bin/python" -m pytest tests/test_app_guidance.py tests/test_host_children.py tests/test_child_image_policy.py tests/test_child_resume_admission.py tests/test_host_components.py tests/test_runtime_module_cache.py tests/test_steering_runtime.py tests/test_worker_background_naming.py -q --junitxml="$RUNNER_TEMP/surface-runtime/integration.xml"
          python scripts/integration_checks.py check --lane release-runtime --junit "$RUNNER_TEMP/surface-runtime/integration.xml"
      - name: Require native goal and peer continuation regressions without skips
        env:
          UNIFIED_RUNTIME_PYTHON: ${{ runner.temp }}/surface-runtime/.venv/bin/python
          GOAL_PEER_EVIDENCE: ${{ runner.temp }}/goal-peer/traces
        run: |
          mkdir -p "$RUNNER_TEMP/goal-peer"
          "$UNIFIED_RUNTIME_PYTHON" -m pytest tests/test_goal_peer_continuation.py tests/test_task_goal_runtime.py -q --junitxml="$RUNNER_TEMP/goal-peer/results.xml"
          python scripts/check_goal_peer_junit.py "$RUNNER_TEMP/goal-peer/results.xml"
      - name: Retain native goal and peer JUnit and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal-peer-regression
          path: ${{ runner.temp }}/goal-peer
          if-no-files-found: error
      - name: Record the unchanged runtime graph and selected candidate
        run: |
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
          python "$RUNNER_TEMP/release-tools/release_qualification.py" receipt --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --lane runtime --runtime "$RUNNER_TEMP/surface-runtime" --destination "$RUNNER_TEMP/runtime.json"
          cp "$RUNNER_TEMP/surface-runtime/qualified-runtime.json" "$RUNNER_TEMP/qualified-runtime.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-qualification
          path: |
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/qualified-runtime.json
          if-no-files-found: error
      - name: Retain resolved runtime inputs without its environment or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-source-resolution
          path: |
            ${{ runner.temp }}/surface-runtime/uv.lock
            ${{ runner.temp }}/surface-runtime/pyproject.toml
            ${{ runner.temp }}/surface-runtime/build-constraints.txt
            ${{ runner.temp }}/surface-runtime/build-identity.json
          if-no-files-found: ignore
      - name: Retain selected candidate and qualified host dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
          if-no-files-found: ignore
  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          # This job publishes the already-qualified commit; tag checks use the remote.
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-qualification'
          path: ${{ runner.temp }}/qualification
          merge-multiple: true
      - name: Require all matching qualification receipts and original artifact bytes
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" verify-receipts --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --receipts "$RUNNER_TEMP/qualification" --dist dist
      - name: Publish immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python "$RUNNER_TEMP/release-tools/release.py" publish --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --repository "$RELEASE_REPOSITORY"
