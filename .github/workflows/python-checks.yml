name: Full Python checks
# Local/manual qualification and post-release coverage; never a publication gate.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Full qualification or one fixed repair suite (focused checks do not qualify the full suite)
        type: choice
        default: full
        options:
          - full
          - inline-chat-card
          - queued-configuration
          - security-redaction
          - patch-placement-recovery
          - patch-placement-native
          - managed-removal-recovery
          - fresh-cleanup-native
          - shared-work-continuity
          - manager-exception-boundary
          - remote-test-origins
          - shared-work-native
          - cold-control-restore
          - goal-peer-publisher-0410
          - updater-omitted-ref
          - updater-synthetic-acquisition
          - updater-expanded-lock
      core_wheels:
        description: Qualify published Core wheels and real runtime on both Linux architectures
        type: boolean
        default: false
  workflow_call:
    secrets:
      LOOP_LIVE_CI_READ_KEY:
        required: true
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  python:
    if: ${{ !inputs.core_wheels && inputs.suite != 'remote-test-origins' && inputs.suite != 'cold-control-restore' && inputs.suite != 'goal-peer-publisher-0410' && inputs.suite != 'updater-omitted-ref' && inputs.suite != 'updater-synthetic-acquisition' && inputs.suite != 'updater-expanded-lock' && inputs.suite != 'fresh-cleanup-native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHECK_SUITE: ${{ inputs.suite || 'full' }}
    steps:
      - name: Start the full Python evidence deadline before preparation
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import time
          print("PYTHON_CHECK_DEADLINE=" + str(time.monotonic() + 75 * 60))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Record and validate the fixed Python selection
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          suites = {
              'full': [],
              'inline-chat-card': ['tests/test_chat_references.py'],
              'queued-configuration': ['tests/test_queued_configuration_boundary.py', 'tests/test_configuration_recovery_ui.py'],
              'security-redaction': ['tests/test_agent_state.py', 'tests/test_provider_environment.py', 'tests/test_runtime_controls.py'],
              'patch-placement-recovery': ['tests/test_patch_placement_recovery.py', 'tests/test_file_source_guard.py', 'tests/test_file_source_native_children.py', 'tests/test_workspace_writer_modules.py'],
              'patch-placement-native': ['tests/test_patch_placement_native.py', 'tests/test_patch_placement_recovery.py', 'tests/test_configuration_authority.py', 'tests/test_queued_configuration_boundary.py', 'tests/test_runtime_controls.py'],
              'managed-removal-recovery': ['tests/test_dependency_layers.py', 'tests/test_stopped_reservation_recovery.py', 'tests/test_prepared_execution_contract.py', 'tests/test_environment_preparation.py', 'tests/test_test_environment_worker.py', 'tests/test_source_transfer.py', 'tests/test_task_environments.py', 'tests/test_environment_recovery.py', 'tests/test_prelaunch_source_failure.py', 'tests/test_environment_retention.py', 'tests/test_incus_environment_worker.py', 'tests/test_release_qualification.py'],
              'shared-work-continuity': ['tests/test_task_continuity.py', 'tests/test_coordination_delivery.py', 'tests/test_work_invocation.py', 'tests/test_schedules.py', 'tests/test_collaboration_input.py', 'tests/test_coordination_revisions.py', 'tests/test_release_qualification.py', 'tests/test_voice_visual.py', 'tests/test_surface_context.py', 'tests/test_output_image_pairs.py', 'tests/test_memory_personalization.py', 'tests/test_capacity.py'],
              'shared-work-native': ['tests/test_native_provider.py', 'tests/test_coordination_delivery.py', 'tests/test_work_native_effects.py', 'tests/test_work_origin.py', 'tests/test_capacity.py', 'tests/test_release_qualification.py'],
              'manager-exception-boundary': ['tests/test_manager_exception_boundary.py', 'tests/test_manager_failure_details.py', 'tests/test_session_health.py', 'tests/test_retained_failure_recovery.py', 'tests/test_runtime.py'],
          }
          selection = os.environ['CHECK_SUITE']
          if selection not in suites:
              raise SystemExit('Unknown fixed Python suite: ' + selection)
          targets = suites[selection]
          output = Path('output/python-checks')
          output.mkdir(parents=True, exist_ok=True)
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          missing = [path for path in targets if not Path(path).is_file()]
          record = {'suite': selection, 'fullSuite': selection == 'full', 'targets': targets,
                    'revision': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'runId': os.environ.get('GITHUB_RUN_ID'), 'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                    'missing': missing}
          (output / 'selection.json').write_text(json.dumps(record, indent=2) + '\n')
          (output / 'targets.txt').write_text(''.join(path + '\n' for path in targets))
          if missing:
              raise SystemExit('Selected tests are missing: ' + ', '.join(missing))
          PY
      - name: Retain unstarted full Python evidence
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: python scripts/browser_check_runner.py --python-suite --initialize --output output/python-checks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Resolve the declared live-runtime source
        id: runtime-dependency
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          p = tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb"))
          revision = ("76073827ba6742ae026a12b524f596120cd2b314" if os.environ["CHECK_SUITE"] == "manager-exception-boundary"
                      else p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])
          print("revision=" + revision)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Install runtime prerequisites for host and child tests
        run: >-
          uv pip install --python .venv/bin/python
          .ci/loop-live
          'amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main'
          'amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@main'
          'amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate'
          'amplifier-module-tool-filesystem @ git+https://github.com/microsoft/amplifier-module-tool-filesystem@main'
          'amplifier-module-tool-apply-patch @ git+https://github.com/microsoft/amplifier-bundle-filesystem@main#subdirectory=modules/tool-apply-patch'
      - name: Require native file-policy modules and Core entry points
        run: |
          uv run --no-sync python - <<'PY'
          from importlib import import_module
          from importlib.metadata import entry_points
          available = {entry.name: entry for entry in entry_points(group='amplifier.modules')}
          for name in ('loop-live', 'context-simple', 'tool-filesystem', 'tool-apply-patch'):
              module = import_module('amplifier_module_' + name.replace('-', '_'))
              mount = available[name].load()
              if not callable(mount) or mount is not module.mount:
                  raise RuntimeError('Native module entry point is not its canonical mount: ' + name)
          PY
      - name: Select the prepared native-controls interpreter
        if: ${{ env.CHECK_SUITE == 'patch-placement-native' }}
        run: echo "UNIFIED_RUNTIME_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare pinned native receipt dependencies
        if: ${{ env.CHECK_SUITE == 'full' || env.CHECK_SUITE == 'shared-work-native' }}
        run: |
          uv pip install --python .venv/bin/python \
            'amplifier-module-provider-openai[native] @ git+https://github.com/microsoft/amplifier-module-provider-openai@2b35fa334fb2fb2c5c948842e8c7bd691ce5e834' \
            'amplifier-module-tool-exec @ git+https://github.com/microsoft/amplifier-module-tool-exec@f267548ccd1b38a236a46afb96252bb6dd474dcd' \
            'openai==3.29.0' 'websockets==15.0.1' 'hatchling==1.27.0' 'amplifier-core==2.0.2'
          uv run --no-sync python - <<'PY'
          import hashlib, importlib.metadata as m, json, subprocess
          from pathlib import Path
          from amplifier_module_provider_openai.native import NativeSendAdmission, NativeOutboundEnvelope
          from amplifier_module_loop_live.scope import LIVE_OWNER, NATIVE_REQUEST
          import amplifier_module_provider_openai.native as native
          expected = '304a78c2036c6dfe0bf60017844ffec3a0e8b556ad67e3fac20db4b613d276b1'
          assert hashlib.sha256(Path(native.__file__).read_bytes()).hexdigest() == expected
          names = ['amplifier-core', 'amplifier-module-provider-openai', 'amplifier-module-loop-live',
                   'amplifier-module-loop-streaming', 'amplifier-module-tool-exec', 'openai', 'websockets']
          record = {name: {'version': m.version(name),
                          'source': json.loads(m.distribution(name).read_text('direct_url.json') or 'null')}
                    for name in names}
          record['loopCheckout'] = subprocess.check_output(['git', '-C', '.ci/loop-live', 'rev-parse', 'HEAD'], text=True).strip()
          record['providerNativeSha256'] = expected
          Path('output/python-checks/native-readiness.json').write_text(json.dumps(record, indent=2))
          PY
      - name: Run the complete Python suite
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: python -u scripts/browser_check_runner.py --python-suite --output output/python-checks
      - name: Record manager-boundary source and import identity
        if: ${{ env.CHECK_SUITE == 'manager-exception-boundary' }}
        run: |
          uv run --no-sync python - <<'PY' > output/python-checks/boundary-imports.json
          import hashlib, importlib, importlib.metadata as md, json, subprocess, sys
          from pathlib import Path
          result = {"python": sys.version, "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "loopRevision": subprocess.check_output(["git", "-C", ".ci/loop-live", "rev-parse", "HEAD"], text=True).strip(), "modules": {}}
          for name in ("amplifier_web.runtime_worker", "amplifier_web.runtime", "amplifier_web.session_health",
                       "amplifier_module_loop_live.orchestrator", "amplifier_module_loop_live.failures",
                       "amplifier_module_loop_streaming", "amplifier_module_context_simple"):
              module = importlib.import_module(name)
              path = Path(module.__file__)
              result["modules"][name] = {"file": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps(result, indent=2))
          PY
      - name: Run the selected repair suite
        if: ${{ env.CHECK_SUITE != 'full' }}
        shell: bash
        run: |
          mapfile -t targets < output/python-checks/targets.txt
          test "${#targets[@]}" -gt 0
          set -o pipefail
          if [ "$CHECK_SUITE" = manager-exception-boundary ]; then
            git fetch --no-tags --depth=1 origin 8a326ee890e43fa30b59ca8f4654d1ca598c0af2
            mkdir -p output/python-checks/original
            git archive 8a326ee890e43fa30b59ca8f4654d1ca598c0af2 | tar -x -C output/python-checks/original
            set +e
            (cd output/python-checks/original && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
              -c /dev/null -o asyncio_mode=auto --import-mode=importlib -v --tb=short \
              "$GITHUB_WORKSPACE/tests/test_manager_exception_boundary.py::test_real_post_provider_manager_exception_reaches_public_inspection") \
              2>&1 | tee output/python-checks/original-red.log
            red=${PIPESTATUS[0]}
            set -e
            test "$red" -eq 1
            grep -q 'chain = failure.get' output/python-checks/original-red.log || grep -q 'assert any' output/python-checks/original-red.log
            grep -q '/original/amplifier_web/runtime_worker.py' output/python-checks/original-red.log
          fi
          uv run --no-sync pytest -v --tb=short --junitxml=output/python-checks/junit.xml "${targets[@]}" 2>&1 | tee output/python-checks/pytest.log
      - name: Verify installed native receipt boundary outside checkout
        if: ${{ env.CHECK_SUITE == 'shared-work-native' }}
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir output/python-checks/wheel .
          uv pip freeze --python .venv/bin/python > output/python-checks/native-freeze.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('output/python-checks/native-freeze.txt')
          rows = [r for r in p.read_text().splitlines() if not r.startswith(('-e ', '#', 'amplifier-unified'))]
          Path('output/python-checks/installed-requirements.txt').write_text('\n'.join(rows) + '\n')
          PY
          uv venv --python 3.13 "$RUNNER_TEMP/native-receipt-installed"
          # Install the complete already-resolved snapshot, not a new graph
          # combining pinned VCS commits with moving transitive URLs.
          uv pip install --python "$RUNNER_TEMP/native-receipt-installed/bin/python" --no-deps -r output/python-checks/installed-requirements.txt
          uv pip install --python "$RUNNER_TEMP/native-receipt-installed/bin/python" --no-deps output/python-checks/wheel/*.whl
          uv pip check --python "$RUNNER_TEMP/native-receipt-installed/bin/python"
          mkdir "$RUNNER_TEMP/native-receipt-tests"
          cp tests/*.py "$RUNNER_TEMP/native-receipt-tests/"
          unset PYTHONPATH
          cd "$RUNNER_TEMP/native-receipt-tests"
          "$RUNNER_TEMP/native-receipt-installed/bin/python" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import amplifier_web.native_provider as native
          source = Path(os.environ['GITHUB_WORKSPACE'])
          actual = Path(native.__file__)
          assert not actual.is_relative_to(source)
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(actual) == digest(source / 'amplifier_web/native_provider.py')
          for name in ('coordination_delivery', 'app_guidance', 'runtime_worker', 'execution_events', 'surface_delivery'):
              import importlib
              module = Path(importlib.import_module('amplifier_web.' + name).__file__)
              assert not module.is_relative_to(source)
              assert digest(module) == digest(source / ('amplifier_web/' + name + '.py'))
          (source / 'output/python-checks/installed-native.json').write_text(json.dumps(
              {'installed': str(actual), 'sha256': digest(actual), 'outsideCheckout': True}))
          PY
          "$RUNNER_TEMP/native-receipt-installed/bin/python" -m pytest -v --tb=short --asyncio-mode=auto --import-mode=importlib \
            test_native_provider.py test_coordination_delivery.py test_work_origin.py test_capacity.py \
            --junitxml="$GITHUB_WORKSPACE/output/python-checks/installed-junit.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/python-checks/installed-pytest.log"
          python - <<'PY'
          import os, xml.etree.ElementTree as E
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'output/python-checks'
          for name in ('junit.xml', 'installed-junit.xml'):
              cases = E.parse(root / name).findall('.//testcase')
              assert cases and all(not any(c.find(k) is not None for k in ('failure', 'error', 'skipped')) for c in cases)
          PY
          "$RUNNER_TEMP/native-receipt-installed/bin/python" - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, xml.etree.ElementTree as E
          from pathlib import Path
          import amplifier_web.native_provider as native
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'output/python-checks'
          negative = Path(os.environ['RUNNER_TEMP']) / 'native-receipt-negative'
          shutil.copytree(Path(native.__file__).parent, negative / 'amplifier_web')
          target = negative / 'amplifier_web/native_provider.py'
          corrected = 'if self.state.get("outcome") in {"submitting", "sent", "running", "pending"}:'
          old = 'if self.state.get("outcome") in {"submitting", "running", "pending"}:'
          text = target.read_text()
          assert text.count(corrected) == 1
          target.write_text(text.replace(corrected, old, 1))
          env = {**os.environ, 'PYTHONPATH': str(negative)}
          probe = subprocess.check_output([sys.executable, '-c',
              'import amplifier_web.native_provider as n; print(n.__file__)'], env=env, text=True).strip()
          assert Path(probe) == target
          with (output / 'negative-control.log').open('w') as log:
              result = subprocess.run([sys.executable, '-m', 'pytest', '-v', '--tb=short',
                  '--asyncio-mode=auto', '--import-mode=importlib',
                  'test_native_provider.py::test_restart_after_send_before_response_is_unknown_and_blocks_transport',
                  '--junitxml=' + str(output / 'negative-control.xml')], env=env, stdout=log, stderr=subprocess.STDOUT)
          cases = E.parse(output / 'negative-control.xml').findall('.//testcase')
          assert result.returncode == 1 and len(cases) == 1
          failure = cases[0].find('failure')
          assert failure is not None and "'sent' == 'unknown'" in (failure.text or '')
          assert cases[0].find('error') is None and cases[0].find('skipped') is None
          (output / 'negative-control.json').write_text(json.dumps({
              'mutation': 'Restore only the old missing-sent top-level restart set',
              'expectedFailure': True, 'returncode': result.returncode,
              'mutatedSha256': hashlib.sha256(target.read_bytes()).hexdigest()}))
          # Independent counterfactual: disable only exact current input-scope
          # equality in a second installed copy. A plausible stale origin must
          # make the real current-input test fail, not merely fail to import.
          origin_negative = Path(os.environ['RUNNER_TEMP']) / 'work-origin-negative'
          shutil.copytree(Path(native.__file__).parent, origin_negative / 'amplifier_web')
          target = origin_negative / 'amplifier_web/coordination_delivery.py'
          text = target.read_text()
          guard = 'and self._scope() == origin.scope_json'
          assert text.count(guard) == 1
          target.write_text(text.replace(guard, 'and True', 1))
          env = {**os.environ, 'PYTHONPATH': str(origin_negative)}
          with (output / 'origin-negative.log').open('w') as log:
              result = subprocess.run([sys.executable, '-m', 'pytest', '-v', '--tb=short',
                  '--asyncio-mode=auto', '--import-mode=importlib',
                  'test_coordination_delivery.py::test_effect_origin_joins_actual_admission_and_full_input_scope[new_input]',
                  '--junitxml=' + str(output / 'origin-negative.xml')], env=env, stdout=log, stderr=subprocess.STDOUT)
          cases = E.parse(output / 'origin-negative.xml').findall('.//testcase')
          assert result.returncode == 1 and len(cases) == 1
          failure = cases[0].find('failure')
          assert failure is not None and 'AssertionError' in (failure.text or '')
          assert cases[0].find('error') is None and cases[0].find('skipped') is None
          (output / 'origin-negative.json').write_text(json.dumps({
              'mutation': 'Disable only origin current input-scope equality',
              'expectedFailure': True, 'returncode': result.returncode,
              'mutatedSha256': hashlib.sha256(target.read_bytes()).hexdigest()}))
          PY
      - name: Build the exact manager-boundary candidate wheel
        if: ${{ env.CHECK_SUITE == 'manager-exception-boundary' }}
        run: |
          uv build --wheel --out-dir output/python-checks/dist
          sha256sum output/python-checks/dist/*.whl > output/python-checks/wheel-sha256.txt
          uv pip install --python .venv/bin/python --no-deps --target output/python-checks/wheel-install output/python-checks/dist/*.whl
          cd output/python-checks
          PYTHONPATH="$PWD/wheel-install" "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY' > wheel-imports.json
          import hashlib, importlib, json
          from pathlib import Path
          root = (Path.cwd() / "wheel-install").resolve()
          result = {}
          for name in ("amplifier_web.runtime_worker", "amplifier_web.runtime", "amplifier_web.session_health",
                       "amplifier_web.support_diagnostics", "amplifier_web.service"):
              module = importlib.import_module(name)
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(root), (name, path)
              result[name] = {"file": str(path.relative_to(root)), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps(result, indent=2))
          PY
      - name: Finalize available full Python evidence without replay
        if: ${{ always() && env.CHECK_SUITE == 'full' }}
        run: python scripts/browser_check_runner.py --python-suite --finalize --output output/python-checks
      - name: Retain complete and partial Python results
        # The early 75-minute deadline reserves job time for cleanup/upload.
        # This is not a separate five-minute upload timeout or a runner-loss guarantee.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-results-${{ github.run_attempt }}
          path: |
            output/python-checks/
            !output/python-checks/junit.pending.xml
          if-no-files-found: warn
  incompatible-selection:
    if: ${{ inputs.core_wheels && inputs.suite && inputs.suite != 'full' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Core-wheel qualification requires suite=full; focused selection was not run.'
          exit 1
  core-wheels:
    if: ${{ inputs.core_wheels && (!inputs.suite || inputs.suite == 'full') }}
    uses: ./.github/workflows/core-wheels.yml
    secrets:
      LOOP_LIVE_CI_READ_KEY: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}

  remote-test-origins:
    if: ${{ !inputs.core_wheels && inputs.suite == 'remote-test-origins' }}
    uses: ./.github/workflows/remote-test-origins.yml

  goal-peer-publisher-0410:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.core_wheels && inputs.suite == 'goal-peer-publisher-0410' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # Setup/upload allowance; locked preparation 900s, tests together 300s.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain candidate and unrun fixed phases
        id: initialize
        run: python scripts/goal_peer_publisher_checks.py --initialize
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.13.17'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        id: uv
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Fetch only the immutable failed publisher evidence
        id: inputs
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/microsoft/amplifier-unified/actions/runs/41179992422/attempts/1 > output/goal-peer-publisher0410/run.json
          gh api repos/microsoft/amplifier-unified/actions/artifacts/13033939559 > output/goal-peer-publisher0410/artifact.json
          gh api repos/microsoft/amplifier-unified/actions/artifacts/13033939559/zip > output/goal-peer-publisher0410/runtime-source-resolution.zip
          python scripts/goal_peer_publisher_checks.py --inputs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: loop
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ccc4aa8a0bb0efdbc9e4023c2feab47d19c4bcaf
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: recipes
        with:
          repository: microsoft/amplifier-bundle-recipes
          ref: 7afaba7455743fb26b8d8a11cd1394eb7a01628a
          path: .ci/recipes
          persist-credentials: false
      - name: Restore the unchanged lock and run only the fixed cases
        id: qualification
        timeout-minutes: 22
        run: |
          set -o pipefail
          python -u scripts/goal_peer_publisher_checks.py --run 2>&1 | tee output/goal-peer-publisher0410/driver.log
      - name: Retain workflow outcome without promoting incomplete checks
        if: always()
        env:
          QUALIFICATION_JOB_STATUS: ${{ job.status }}
          # Only action outcomes, never arbitrary step outputs or credential state.
          QUALIFICATION_STEP_OUTCOMES: >-
            {"initialize":"${{ steps.initialize.outcome }}","python":"${{ steps.python.outcome }}",
            "uv":"${{ steps.uv.outcome }}","inputs":"${{ steps.inputs.outcome }}",
            "loop":"${{ steps.loop.outcome }}","recipes":"${{ steps.recipes.outcome }}",
            "qualification":"${{ steps.qualification.outcome }}"}
        run: python scripts/goal_peer_publisher_checks.py --finalize
      - name: Retain exact inputs and all partial qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal-peer-publisher0410-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/goal-peer-publisher0410/
          if-no-files-found: error
          retention-days: 14

  cold-control-restore:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.core_wheels && inputs.suite == 'cold-control-restore' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Setup/upload allowance; qualification itself has a fixed 600s ceiling.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain fixed qualification inputs before preparation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p output/cold-control-restore-inputs
          cp scripts/cold_restore_checks.py scripts/browser_check_runner.py .github/workflows/python-checks.yml pyproject.toml uv.lock output/cold-control-restore-inputs/
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > output/cold-control-restore-inputs/dispatch.txt
          sha256sum scripts/cold_restore_checks.py scripts/browser_check_runner.py .github/workflows/python-checks.yml pyproject.toml uv.lock > output/cold-control-restore-inputs/sha256.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Resolve the exact locked private runtime source
        id: runtime
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib
          lock = tomllib.load(open('uv.lock', 'rb'))
          row, = [p for p in lock['package'] if p['name'] == 'amplifier-module-loop-live']
          source, revision = row['source']['git'].rsplit('#', 1)
          assert source.startswith('https://github.com/microsoft/amplifier-module-loop-live?')
          assert re.fullmatch('[0-9a-f]{40}', revision)
          print('revision=' + revision)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Qualify fixed source and installed cold restore once
        timeout-minutes: 11
        run: |
          set -o pipefail
          python -u scripts/cold_restore_checks.py 2>&1 | tee output/cold-control-restore-run.log
      - name: Retain all evidence including failed and unrun phases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cold-control-restore-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/cold-control-restore-inputs/
            output/cold-control-restore-run.log
            output/cold-control-restore/
          if-no-files-found: error
          retention-days: 14

  updater-omitted-ref:
    if: ${{ !inputs.core_wheels && inputs.suite == 'updater-omitted-ref' }}
    uses: ./.github/workflows/updater-omitted-ref.yml
    secrets:
      LOOP_LIVE_CI_READ_KEY: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}

  updater-synthetic-acquisition:
    if: ${{ !inputs.core_wheels && inputs.suite == 'updater-synthetic-acquisition' }}
    uses: ./.github/workflows/updater-synthetic-acquisition.yml

  updater-expanded-lock:
    if: ${{ !inputs.core_wheels && inputs.suite == 'updater-expanded-lock' }}
    uses: ./.github/workflows/updater-omitted-ref.yml
    with:
      offline_lock_preflight: true
    secrets:
      LOOP_LIVE_CI_READ_KEY: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}

  fresh-cleanup-native:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.core_wheels && inputs.suite == 'fresh-cleanup-native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CHECK_SUITE: fresh-cleanup-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.17'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-smart-tool-digital-twin-universe
          ref: 5235833098d9a630791452a46558d92f58af0389
          path: .ci/dtu-core
          persist-credentials: false
      - name: Qualify only the native interrupted-cleanup journey
        timeout-minutes: 22
        env:
          CLEANUP_NATIVE_ROOT: ${{ runner.temp }}/unified-cleanup-native
          CLEANUP_NATIVE_OUTPUT: ${{ github.workspace }}/output/fresh-cleanup-native
        run: |
          set -o pipefail
          mkdir -p output/fresh-cleanup-native
          python -u scripts/fresh_cleanup_native_checks.py 2>&1 | tee output/fresh-cleanup-native/driver.log
      - name: Retain native cleanup evidence including failed prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-cleanup-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/fresh-cleanup-native/
          if-no-files-found: error
          retention-days: 14
